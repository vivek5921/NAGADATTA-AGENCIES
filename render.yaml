# Render Infrastructure as Code Blueprint
# Deploy Nagadatta Agencies with PostgreSQL database and Express Web Service

services:
  - type: web
    name: nagadatta-agencies-web
    env: node
    plan: free
    region: oregon
    buildCommand: "npm --prefix server install && npm --prefix client install && npm --prefix client run build"
    startCommand: "node server/server.js"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nagadatta-db
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: nagadatta-db
    plan: free
    region: oregon
    databaseName: nagadatta_db
    user: nagadatta_admin
